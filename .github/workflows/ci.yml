name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e '.[dev,pdf,image,ocr]'
      - run: python -m pytest
      - run: ruff check src tests
      - run: mypy src
      - run: python tools/check_release_tree.py
      - run: python -m build
